name: ticketfut
description: TicketFut - ingressos de futebol com autenticação biométrica e reconhecimento facial.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  go_router: ^14.2.7
  get_it: ^7.7.0
  local_auth: ^2.3.0
  camera: ^0.11.0+2
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  intl: 0.20.3
  camera_android: ^0.10.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
