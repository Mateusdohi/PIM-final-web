# Sobe SQL Server + backend C# (com captcha próprio e MFA por aplicativo autenticador).
# Uso:  cp .env.example .env   (edite os valores)  &&  docker compose up --build
# Reconhecimento facial foi removido: não existe mais o microsserviço Python.
name: ${COMPOSE_NAME:-ticketfut}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports: ["${DB_PORT:-1433}:1433"]
    volumes: [sqldata:/var/opt/mssql]

  api:
    build: ./backend
    depends_on: [db]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=db,1433;Database=TicketFut;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Database__AutoCreate: "true"
      Jwt__Key: ${JWT_KEY}
      # chave AES-256 (base64, 32 bytes) que protege o segredo do autenticador no banco
      Mfa__EncryptionKey: ${MFA_ENCRYPTION_KEY}
      Captcha__Enabled: ${CAPTCHA_ENABLED:-true}
      # origens extras do site no navegador (CORS), separadas por vírgula não: uma por variável Cors__AllowedOrigins__N
      Cors__AllowedOrigins__0: ${WEB_ORIGIN_0:-http://localhost:5500}
      Cors__AllowedOrigins__1: ${WEB_ORIGIN_1:-http://127.0.0.1:5500}
      Cors__AllowedOrigins__2: ${WEB_ORIGIN_2:-http://localhost:5501}
      Cors__AllowedOrigins__3: ${WEB_ORIGIN_3:-http://127.0.0.1:5501}
    # API_PORT = app mobile (emulador usa 10.0.2.2:8080); WEB_PORT = site web (js/api.js usa localhost:5080)
    ports: ["${API_PORT:-8080}:8080", "${WEB_PORT:-5080}:8080"]

volumes:
  sqldata:
